<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::section}, 'students')}"
      lang="tr"
      xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<body>
<section>
    <div class="page-header">
        <h1>Öğrenciler</h1>
    </div>

    <div class="filter-bar">
        <input type ="text" id="nameFilter" placeholder="İsme göre ara...">
    </div>

    <table class="data-table">
        <thead>
        <tr>
            <th>No</th>
            <th>Ad Soyad</th>
            <th>Sınıf</th>
            <th>İşlemler</th>
        </tr>
        </thead>
        <tbody id="studentTableBody">
        <tr th:each="student : ${students}" th:attr="data-id=${student.id}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.fullName}"></td>
            <td th:text="${student.className}"></td>
            <td class="actions">
                <a href="#" class="edit-link" th:attr="data-id=${student.id}">Düzenle</a>
                <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post"
                      onsubmit="return confirm('Bu öğrenciyi silmek istediğinize emin misiniz?');">
                    <button type="submit" class="link-danger">Sil</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <aside class="side-form">
        <h2 id="formTitle">Öğrenci Ekle</h2>
        <form id="studentForm" th:action="@{/students/add}" method="post">
            <label>Ad Soyad
                <input type="text" name="fullName" id="studentFullName" required>
            </label>
            <label>Sınıf
                <input type="text" name="className" id="studentClassName" list="classGroupList" required>
                <datalist id="classGroupList">
                    <option th:each="cg : ${classGroups}" th:value="${cg.name}"></option>
                </datalist>
            </label>
            <button type="submit" class="btn btn-primary">Kaydet</button>
            <button type="button" id="cancelEditBtn" style="display:none">İptal</button>
        </form>
    </aside>

    <form class="import-form" th:action="@{/students/import}" method="post" enctype="multipart/form-data">
        <h2>Excel'den İçe Aktar</h2>
        <label class="file-drop">
            <input type="file" id="importFile" name="file" accept=".xlsx, .xls" required>
            <span id="importFileName">Buradan dosya seçiniz</span>
        </label>
        <button type="submit" class="btn btn-primary">İçe Aktar</button>
    </form>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="error"></p>
    <p th:if="${importSummary}" th:text="${importSummary}"></p>

    <script th:src="@{/js/student.js}"></script>
</section>
</body>
</html>
