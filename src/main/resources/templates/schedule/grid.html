<!DOCTYPE html>
<html th:replace="~{layout/base :: layout(~{::section}, 'schedule')}"
      lang="tr"
      xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<body>
<section>
    <div class="page-header">
        <h1>Ders Programları</h1>
    </div>

    <div class="select-bar">
        <select id="teacherSelect">
            <option th:each="t : ${teachers}"
                    th:value="${t.id}"
                    th:text="${t.fullName}"
                    th:selected="${t.id == selectedTeacher?.id}">
            </option>
        </select>
    </div>

    <p th:if="${selectedTeacher == null}" class="error">
        Önce Öğretmenler sayfasından bir öğretmen ekleyin.
    </p>

    <div class="weekly-schedule" th:if="${selectedTeacher != null}">
        <h2>Hafta İçi Programı</h2>
        <table class="data-table schedule-grid">
            <thead>
            <tr>
                <th>Saat</th>
                <th th:each="day : ${weekdayDays}" th:text="${T(com.tutorschedule.app.util.DayOfWeekTr).of(day)}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="slot : ${weekdaySlots}">
                <td th:text="${#temporals.format(slot.startTime,'HH:mm')} + ' - ' + ${#temporals.format(slot.endTime,'HH:mm')}"></td>

                <td th:each="day : ${weekdayDays}"
                    class="schedule-cell"
                    th:with="cell=${scheduleGrid?.get(slot.id)?.get(day)}"
                    th:classappend="${cell != null} ? ${'status-' + cell.status}">

                    <span class="cell-display"
                          th:text="${cell == null} ? 'Boş' : (${cell.status.name() == 'BUSY'} ? ${cell.className} : (${cell.status.name() == 'FREE'} ? 'Boş' : 'Bloklu'))">
                    </span>

                    <form class="cell-edit-form" method="post" th:action="@{/schedule/update}" style="display:none">
                        <input type="hidden" name="teacherId" th:value="${selectedTeacher.id}">
                        <input type="hidden" name="dayOfWeek" th:value="${day}">
                        <input type="hidden" name="timeSlotId" th:value="${slot.id}">

                        <select name="status">
                            <option value="FREE" th:selected="${cell?.status?.name() == 'FREE'}">Boş</option>
                            <option value="BUSY" th:selected="${cell?.status?.name() == 'BUSY'}">Meşgul</option>
                            <option value="BLOCKED" th:selected="${cell?.status?.name() == 'BLOCKED'}">Bloklu</option>
                        </select>

                        <input type="text" name="className" placeholder="Sınıf"
                               th:value="${cell?.className}">

                        <button type="submit">Kaydet</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="weekly-schedule" th:if="${selectedTeacher != null}">
        <h2>Hafta Sonu Programı</h2>
        <table class="data-table schedule-grid">
            <thead>
            <tr>
                <th>Saat</th>
                <th th:each="day : ${weekendDays}" th:text="${T(com.tutorschedule.app.util.DayOfWeekTr).of(day)}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="slot : ${weekendSlots}">
                <td th:text="${#temporals.format(slot.startTime,'HH:mm')} + ' - ' + ${#temporals.format(slot.endTime,'HH:mm')}"></td>

                <td th:each="day : ${weekendDays}"
                    class="schedule-cell"
                    th:with="cell=${scheduleGrid?.get(slot.id)?.get(day)}"
                    th:classappend="${cell != null} ? ${'status-' + cell.status}">

                    <span class="cell-display"
                          th:text="${cell == null} ? 'Boş' : (${cell.status.name() == 'BUSY'} ? ${cell.className} : (${cell.status.name() == 'FREE'} ? 'Boş' : 'Bloklu'))">
                    </span>

                    <form class="cell-edit-form" method="post" th:action="@{/schedule/update}" style="display:none">
                        <input type="hidden" name="teacherId" th:value="${selectedTeacher.id}">
                        <input type="hidden" name="dayOfWeek" th:value="${day}">
                        <input type="hidden" name="timeSlotId" th:value="${slot.id}">

                        <select name="status">
                            <option value="FREE" th:selected="${cell?.status?.name() == 'FREE'}">Boş</option>
                            <option value="BUSY" th:selected="${cell?.status?.name() == 'BUSY'}">Meşgul</option>
                            <option value="BLOCKED" th:selected="${cell?.status?.name() == 'BLOCKED'}">Bloklu</option>
                        </select>

                        <input type="text" name="className" placeholder="Sınıf"
                               th:value="${cell?.className}">

                        <button type="submit">Kaydet</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form th:if="${selectedTeacher != null}"
          class="export-bar"
          method="get"
          th:action="@{/schedule/export/{id}(id=${selectedTeacher.id})}">
        <label for="exportWeekDate">Randevuların haftası:</label>
        <input type="date" id="exportWeekDate" name="date"
               th:value="${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}">
        <button type="submit" class="btn btn-primary">Excel'e Aktar</button>
    </form>

    <p th:if="${errorMessage}" th:text="${errorMessage}" class="error"></p>

    <script th:src="@{/js/schedule.js}"></script>
</section>
</body>
</html>
